<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
    <!-- Pastel base -->
    <path d="M4 10h16v10c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2V10z" fill="#FFE082"/>
    
    <!-- Capas del pastel -->
    <rect x="4" y="14" width="16" height="2" fill="#FFCC02"/>
    <rect x="4" y="18" width="16" height="2" fill="#FFC107"/>
    
    <!-- Velas -->
    <rect x="7" y="6" width="1" height="4" fill="#8D6E63"/>
    <rect x="11" y="6" width="1" height="4" fill="#8D6E63"/>
    <rect x="15" y="6" width="1" height="4" fill="#8D6E63"/>
    
    <!-- Llamas de las velas -->
    <ellipse cx="7.5" cy="5.5" rx="0.8" ry="1.2" fill="#FF5722"/>
    <ellipse cx="11.5" cy="5.5" rx="0.8" ry="1.2" fill="#FF5722"/>
    <ellipse cx="15.5" cy="5.5" rx="0.8" ry="1.2" fill="#FF5722"/>
    
    <!-- Centro de las llamas -->
    <ellipse cx="7.5" cy="5.8" rx="0.4" ry="0.6" fill="#FFD600"/>
    <ellipse cx="11.5" cy="5.8" rx="0.4" ry="0.6" fill="#FFD600"/>
    <ellipse cx="15.5" cy="5.8" rx="0.4" ry="0.6" fill="#FFD600"/>
    
    <!-- Decoraciones del pastel -->
    <circle cx="6" cy="12" r="0.8" fill="#E91E63"/>
    <circle cx="9" cy="12" r="0.8" fill="#4CAF50"/>
    <circle cx="12" cy="12" r="0.8" fill="#2196F3"/>
    <circle cx="15" cy="12" r="0.8" fill="#E91E63"/>
    <circle cx="18" cy="12" r="0.8" fill="#4CAF50"/>
    
    <!-- Crema decorativa -->
    <path d="M5 10c1 -1, 2 1, 3 -1s2 1, 3 -1s2 1, 3 -1s2 1, 3 -1s2 1, 2 -1" 
            stroke="#F8BBD9" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M5 16c1 -1, 2 1, 3 -1s2 1, 3 -1s2 1, 3 -1s2 1, 3 -1s2 1, 2 -1" 
            stroke="#F8BBD9" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Brillo en las velas -->
    <rect x="7.2" y="7" width="0.3" height="2" fill="#A1887F" opacity="0.6"/>
    <rect x="11.2" y="7" width="0.3" height="2" fill="#A1887F" opacity="0.6"/>
    <rect x="15.2" y="7" width="0.3" height="2" fill="#A1887F" opacity="0.6"/>
</svg>