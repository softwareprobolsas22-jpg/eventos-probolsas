<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
    <!-- Maletín base -->
    <path d="M20 6h-2.5V4c0-1.1-.9-2-2-2h-7c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z" 
            fill="#9C27B0"/>
    
    <!-- Tapa del maletín -->
    <rect x="8.5" y="4" width="7" height="2" fill="#7B1FA2" rx="0.5"/>
    
    <!-- Manija -->
    <rect x="11" y="3" width="2" height="1" fill="#4A148C" rx="0.5"/>
    
    <!-- Cerradura -->
    <rect x="11.5" y="6.5" width="1" height="1.5" fill="#4A148C"/>
    <circle cx="12" cy="6.8" r="0.3" fill="#FFD700"/>
    
    <!-- Detalles del maletín -->
    <rect x="2" y="10" width="20" height="1" fill="#7B1FA2"/>
    <rect x="2" y="13" width="20" height="1" fill="#7B1FA2"/>
    <rect x="2" y="16" width="20" height="1" fill="#7B1FA2"/>
    
    <!-- Esquinas redondeadas -->
    <circle cx="4" cy="8" r="0.5" fill="#7B1FA2"/>
    <circle cx="20" cy="8" r="0.5" fill="#7B1FA2"/>
    <circle cx="4" cy="19" r="0.5" fill="#7B1FA2"/>
    <circle cx="20" cy="19" r="0.5" fill="#7B1FA2"/>
    
    <!-- Documentos dentro del maletín -->
    <rect x="5" y="11" width="3" height="4" fill="#E1BEE7" rx="0.2"/>
    <rect x="9" y="11" width="3" height="4" fill="#E1BEE7" rx="0.2"/>
    <rect x="13" y="11" width="3" height="4" fill="#E1BEE7" rx="0.2"/>
    <rect x="17" y="11" width="2" height="4" fill="#E1BEE7" rx="0.2"/>
    
    <!-- Líneas en los documentos -->
    <line x1="5.5" y1="12" x2="7.5" y2="12" stroke="#9C27B0" stroke-width="0.3"/>
    <line x1="5.5" y1="13" x2="7.5" y2="13" stroke="#9C27B0" stroke-width="0.3"/>
    <line x1="5.5" y1="14" x2="7" y2="14" stroke="#9C27B0" stroke-width="0.3"/>
    
    <line x1="9.5" y1="12" x2="11.5" y2="12" stroke="#9C27B0" stroke-width="0.3"/>
    <line x1="9.5" y1="13" x2="11.5" y2="13" stroke="#9C27B0" stroke-width="0.3"/>
    <line x1="9.5" y1="14" x2="11" y2="14" stroke="#9C27B0" stroke-width="0.3"/>
    
    <line x1="13.5" y1="12" x2="15.5" y2="12" stroke="#9C27B0" stroke-width="0.3"/>
    <line x1="13.5" y1="13" x2="15.5" y2="13" stroke="#9C27B0" stroke-width="0.3"/>
    <line x1="13.5" y1="14" x2="15" y2="14" stroke="#9C27B0" stroke-width="0.3"/>
    
    <!-- Reflejos y sombras -->
    <rect x="2" y="8" width="20" height="0.5" fill="#BA68C8" opacity="0.7"/>
    <rect x="8.5" y="4" width="7" height="0.3" fill="#BA68C8" opacity="0.5"/>
    
    <!-- Icono de reunión en el maletín -->
    <circle cx="12" cy="18" r="1.5" fill="#4A148C"/>
    <circle cx="10.5" cy="17.5" r="0.8" fill="#E1BEE7"/>
    <circle cx="13.5" cy="17.5" r="0.8" fill="#E1BEE7"/>
    <circle cx="12" cy="18.5" r="0.8" fill="#E1BEE7"/>
</svg>