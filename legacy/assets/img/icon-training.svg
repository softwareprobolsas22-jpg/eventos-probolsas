<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
    <!-- Birrete (gorro de graduación) -->
    <path d="M12 2l10 4v1l-10 4L2 7V6l10-4z" fill="#4CAF50"/>
    
    <!-- Sombra del birrete -->
    <path d="M12 6l10 4v0.5l-10 4L2 10.5V10l10-4z" fill="#388E3C" opacity="0.7"/>
    
    <!-- Borla del birrete -->
    <circle cx="19" cy="8" r="0.8" fill="#FFD700"/>
    <line x1="19" y1="8.8" x2="19" y2="10.5" stroke="#FFC107" stroke-width="0.3"/>
    <circle cx="19" cy="10.5" r="0.5" fill="#FF9800"/>
    
    <!-- Hilo de la borla -->
    <path d="M19 10.5 Q19.5 11, 19 11.5 Q18.5 11, 19 11.5 Q19.5 12, 19 12.5" 
            stroke="#FFC107" stroke-width="0.2" fill="none"/>
    
    <!-- Libro abierto -->
    <path d="M5 13h14v8H5z" fill="#E8F5E8"/>
    
    <!-- Páginas del libro -->
    <path d="M5 13v8l7-1V12l-7 1z" fill="#C8E6C9"/>
    <path d="M12 12v8l7 1v-8l-7-1z" fill="#A5D6A7"/>
    
    <!-- Líneas del texto en las páginas -->
    <line x1="6" y1="15" x2="11" y2="14.7" stroke="#4CAF50" stroke-width="0.3"/>
    <line x1="6" y1="16" x2="10.5" y2="15.8" stroke="#4CAF50" stroke-width="0.3"/>
    <line x1="6" y1="17" x2="11" y2="16.7" stroke="#4CAF50" stroke-width="0.3"/>
    <line x1="6" y1="18" x2="10" y2="17.8" stroke="#4CAF50" stroke-width="0.3"/>
    <line x1="6" y1="19" x2="11" y2="18.7" stroke="#4CAF50" stroke-width="0.3"/>
    
    <line x1="13" y1="14.3" x2="18" y2="15" stroke="#4CAF50" stroke-width="0.3"/>
    <line x1="13.5" y1="15.2" x2="18" y2="16" stroke="#4CAF50" stroke-width="0.3"/>
    <line x1="13" y1="16.3" x2="18" y2="17" stroke="#4CAF50" stroke-width="0.3"/>
    <line x1="14" y1="17.2" x2="18" y2="18" stroke="#4CAF50" stroke-width="0.3"/>
    <line x1="13" y1="18.3" x2="18" y2="19" stroke="#4CAF50" stroke-width="0.3"/>
    
    <!-- Lomo del libro -->
    <rect x="11.7" y="12" width="0.6" height="9" fill="#2E7D32"/>
    
    <!-- Marcapáginas -->
    <rect x="8" y="11" width="0.4" height="3" fill="#FF5722"/>
    <rect x="15" y="11" width="0.4" height="3" fill="#2196F3"/>
    
    <!-- Pluma/lápiz -->
    <line x1="16" y1="9" x2="18" y2="11" stroke="#8D6E63" stroke-width="0.8"/>
    <circle cx="18" cy="11" r="0.3" fill="#D84315"/>
    <line x1="15.7" y1="8.7" x2="16.3" y2="9.3" stroke="#FFD600" stroke-width="0.2"/>
    
    <!-- Diploma/certificado -->
    <rect x="7" y="8" width="3" height="2" fill="#FFF3E0" rx="0.1"/>
    <rect x="7.2" y="8.2" width="2.6" height="0.2" fill="#FF9800"/>
    <line x1="7.5" y1="8.7" x2="9.5" y2="8.7" stroke="#FF9800" stroke-width="0.1"/>
    <line x1="7.5" y1="9.2" x2="9" y2="9.2" stroke="#FF9800" stroke-width="0.1"/>
    <circle cx="9.5" cy="9.5" r="0.1" fill="#FF9800"/>
    
    <!-- Sello en el diploma -->
    <circle cx="8.5" cy="9.5" r="0.3" fill="#F44336"/>
    <path d="M8.5 9.2 L8.7 9.5 L8.5 9.8 L8.3 9.5 Z" fill="#FFD700"/>
    
    <!-- Estrellas de conocimiento -->
    <path d="M3 11 L3.3 11.5 L3.8 11.3 L3.5 11.8 L4 12 L3.5 12.2 L3.8 12.7 L3.3 12.5 L3 13 L2.7 12.5 L2.2 12.7 L2.5 12.2 L2 12 L2.5 11.8 L2.2 11.3 L2.7 11.5 Z" 
            fill="#FFD700"/>
    <path d="M21 13 L21.2 13.3 L21.5 13.2 L21.3 13.5 L21.6 13.6 L21.3 13.7 L21.5 14 L21.2 13.9 L21 14.2 L20.8 13.9 L20.5 14 L20.7 13.7 L20.4 13.6 L20.7 13.5 L20.5 13.2 L20.8 13.3 Z" 
            fill="#FFD700"/>
    
    <!-- Detalles del birrete -->
    <rect x="11.8" y="2.5" width="0.4" height="3" fill="#2E7D32"/>
    <circle cx="12" cy="2" r="0.2" fill="#66BB6A"/>
    
    <!-- Brillo en el libro -->
    <path d="M5 13 Q8 12.5, 12 13 Q16 12.5, 19 13 v0.5 Q16 13, 12 13.5 Q8 13, 5 13.5 Z" 
            fill="#F1F8E9" opacity="0.6"/>
    
    <!-- Sombra del libro -->
    <ellipse cx="12" cy="21.5" rx="7" ry="0.5" fill="#388E3C" opacity="0.3"/>
</svg>