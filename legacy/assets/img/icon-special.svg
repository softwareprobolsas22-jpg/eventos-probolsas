<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
    <!-- Estrella principal -->
    <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2L12 16.8 5.6 21.2 8 14l-6-4.8h7.6L12 2z" 
            fill="#2196F3"/>
    
    <!-- Sombra de la estrella -->
    <path d="M12 2.5l2.3 6.8h7.2l-5.7 4.5 2.3 6.8L12 16.3 5.9 20.6l2.3-6.8L2.5 9.3h7.2L12 2.5z" 
            fill="#1976D2" opacity="0.7"/>
    
    <!-- Centro brillante de la estrella -->
    <circle cx="12" cy="12" r="2.5" fill="#81D4FA"/>
    <circle cx="12" cy="12" r="1.5" fill="#E1F5FE"/>
    <circle cx="12" cy="12" r="0.8" fill="#B3E5FC"/>
    
    <!-- Rayos de luz -->
    <line x1="12" y1="1" x2="12" y2="3" stroke="#FFD700" stroke-width="0.8" opacity="0.8"/>
    <line x1="12" y1="21" x2="12" y2="23" stroke="#FFD700" stroke-width="0.8" opacity="0.8"/>
    <line x1="1" y1="12" x2="3" y2="12" stroke="#FFD700" stroke-width="0.8" opacity="0.8"/>
    <line x1="21" y1="12" x2="23" y2="12" stroke="#FFD700" stroke-width="0.8" opacity="0.8"/>
    
    <!-- Rayos diagonales -->
    <line x1="4.1" y1="4.1" x2="5.5" y2="5.5" stroke="#FFD700" stroke-width="0.6" opacity="0.6"/>
    <line x1="18.5" y1="18.5" x2="19.9" y2="19.9" stroke="#FFD700" stroke-width="0.6" opacity="0.6"/>
    <line x1="19.9" y1="4.1" x2="18.5" y2="5.5" stroke="#FFD700" stroke-width="0.6" opacity="0.6"/>
    <line x1="5.5" y1="18.5" x2="4.1" y2="19.9" stroke="#FFD700" stroke-width="0.6" opacity="0.6"/>
    
    <!-- Estrellas pequeñas decorativas -->
    <path d="M6 6 L6.2 6.4 L6.6 6.2 L6.4 6.6 L6.8 6.8 L6.4 7 L6.6 7.4 L6.2 7.2 L6 7.6 L5.8 7.2 L5.4 7.4 L5.6 7 L5.2 6.8 L5.6 6.6 L5.4 6.2 L5.8 6.4 Z" 
            fill="#FFD700"/>
    <path d="M18 6 L18.2 6.4 L18.6 6.2 L18.4 6.6 L18.8 6.8 L18.4 7 L18.6 7.4 L18.2 7.2 L18 7.6 L17.8 7.2 L17.4 7.4 L17.6 7 L17.2 6.8 L17.6 6.6 L17.4 6.2 L17.8 6.4 Z" 
            fill="#FFD700"/>
    <path d="M6 18 L6.2 18.4 L6.6 18.2 L6.4 18.6 L6.8 18.8 L6.4 19 L6.6 19.4 L6.2 19.2 L6 19.6 L5.8 19.2 L5.4 19.4 L5.6 19 L5.2 18.8 L5.6 18.6 L5.4 18.2 L5.8 18.4 Z" 
            fill="#FFD700"/>
    <path d="M18 18 L18.2 18.4 L18.6 18.2 L18.4 18.6 L18.8 18.8 L18.4 19 L18.6 19.4 L18.2 19.2 L18 19.6 L17.8 19.2 L17.4 19.4 L17.6 19 L17.2 18.8 L17.6 18.6 L17.4 18.2 L17.8 18.4 Z" 
            fill="#FFD700"/>
    
    <!-- Partículas brillantes -->
    <circle cx="9" cy="8" r="0.4" fill="#E3F2FD"/>
    <circle cx="15" cy="8" r="0.3" fill="#E3F2FD"/>
    <circle cx="9" cy="16" r="0.3" fill="#E3F2FD"/>
    <circle cx="15" cy="16" r="0.4" fill="#E3F2FD"/>
    <circle cx="7" cy="12" r="0.2" fill="#E3F2FD"/>
    <circle cx="17" cy="12" r="0.2" fill="#E3F2FD"/>
    
    <!-- Brillos en las puntas de la estrella -->
    <circle cx="12" cy="2" r="0.5" fill="#FFD700" opacity="0.8"/>
    <circle cx="19.6" cy="9.3" r="0.3" fill="#FFD700" opacity="0.6"/>
    <circle cx="19.6" cy="14.7" r="0.3" fill="#FFD700" opacity="0.6"/>
    <circle cx="12" cy="22" r="0.5" fill="#FFD700" opacity="0.8"/>
    <circle cx="4.4" cy="14.7" r="0.3" fill="#FFD700" opacity="0.6"/>
    <circle cx="4.4" cy="9.3" r="0.3" fill="#FFD700" opacity="0.6"/>
    
    <!-- Gradiente interno de la estrella -->
    <defs>
        <radialGradient id="starGradient" cx="50%" cy="40%" r="60%">
        <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#2196F3;stop-opacity:0.8" />
        <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
        </radialGradient>
    </defs>
    
    <!-- Aplicar gradiente a partes específicas -->
    <path d="M12 4l1.8 5.4h5.7l-4.5 3.6 1.8 5.4L12 15.6 7.2 18.4l1.8-5.4L4.5 9.4h5.7L12 4z" 
            fill="url(#starGradient)" opacity="0.7"/>
    
    <!-- Destellos animados (elementos estáticos para el SVG) -->
    <g opacity="0.8">
        <line x1="12" y1="7" x2="12" y2="9" stroke="#FFFFFF" stroke-width="0.5"/>
        <line x1="11" y1="8" x2="13" y2="8" stroke="#FFFFFF" stroke-width="0.5"/>
    </g>
    
    <g opacity="0.6">
        <line x1="12" y1="15" x2="12" y2="17" stroke="#FFFFFF" stroke-width="0.5"/>
        <line x1="11" y1="16" x2="13" y2="16" stroke="#FFFFFF" stroke-width="0.5"/>
    </g>
    
    <!-- Sombra suave -->
    <ellipse cx="12" cy="23" rx="8" ry="1" fill="#1976D2" opacity="0.2"/>
</svg>